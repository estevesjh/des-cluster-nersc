zt_low      = 0.10
zt_high     = 0.75
lnm_low     = 29.9336
lnm_high    = 35.6814
R_max_cMpch = 35.0
n_lnm       = 16
n_per_seg   = 10
n_zring     = 20
n_zouter    = 20
