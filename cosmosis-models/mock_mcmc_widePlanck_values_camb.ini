; widePlanck mock-MCMC values file.  Replaces the unphysical
; log1e10As = 3.97 (sigma_8 ~ 1.18) cosmology in mock_mcmc_values.ini
; with Planck 2018 base-LCDM (TT,TE,EE+lowE+lensing).  Matches the
; widePlanck values used in:
;   - y3_cluster_cpp/cosmosis-models/smoke_sel_values.ini
;   - y3_cluster_cpp/cosmosis_tests/values/values_comp.ini
;
; Cosmology: 5 varied parameters with flat priors at +/-20 sigma around
; the Planck 2018 best-fit, matching the v3c cp_camb emulator wide-box
; bounds (camb-emulator/camb-for-cp/docs/v3c_validation/cosmology_scan_v3c_values.ini),
; with omega_b tightened to a physical [0.02, 0.10] window.  mnu fixed
; at zero: cp_camb assumes scale-independent D(z) and CAMB's delta_cb
; growth becomes scale-dependent with massive neutrinos
; (see emulator_validation.tex Sec. 1).
;
; HOD: 5 varied parameters.  log10_M1 is replaced by
;   log10_ratio = log10(M1 / Mmin)
; to break the (log10_Mmin, log10_M1) box-car degeneracy that arises
; when both are sampled with flat priors.  The C++ MOR_HOD_t and
; sel_function.py both prefer log10_ratio when present; y3_buzzard/bsel.py
; was patched to do the same in 2026-05-19 (see audit item 10).
;
; Mock DV (data/mock/mock_dv_widePlanck.npz) was generated with
; epsilon = 0.0; the prior here is centred on that to keep closure
; tests honest.

[cosmological_parameters]
; min     start    max
h0        = 0.473  0.6766    0.873
; omega_m floor 0.11 > omega_b ceiling 0.10 so the consistency module
; never sees Omega_b > Omega_m and rejects the draw.  0.11 also matches
; the v3c emulator's trained lower bound (parameters_min[omega_m] =
; 0.109152 in camb_linear_v3c_emulator.npz).
omega_m   = 0.11   0.311049  1.0
omega_b   = 0.02   0.048975  0.10
omega_k   = 0.0
tau       = 0.0544
n_s       = 0.8    0.9665    1.15
; s8 emulator: sample sigma8 directly (replaces log1e10As). Prior narrowed
; to [0.5, 1.5] (inside the trained box [0.350, 1.604]) to help polychord
; converge -- the full box wastes live points on extreme-amplitude corners
; the data rules out anyway. start = 0.8238 = mock fiducial sigma8.
; renamed sigma8 -> sigma_8_input for the CSL camb module (camb_interface.py
; sigma8_to_As iterates A_s to hit this target). sampler=test uses the start.
sigma_8_input = 0.5    0.8238    1.5
w         = -1.0
wa        = 0.0
mnu       = 0.0
num_massive_neutrinos = 0
nnu       = 3.046
neutrino_hierarchy    = 0
; consistency derives omega_nu from mnu (= 0 here) so no need to set it.
; -> sigma_8 ~ 0.811 (CAMB-driven) at the Planck-fiducial centre.

[cluster_abundance]
hmf_s = 0.0
hmf_q = 1.0

[cluster_mor]
; min   start  max     comment
log10_Mmin   = 10.0  11.4   13.0
; log10_ratio bounded so M1 / Mmin in [10, ~30], i.e. exp10(ratio)
; covers an order of magnitude above Mmin.  Avoids spurious "M1 ~
; Mmin" or "M1 >> Mmin" regions outside the physical HOD prior.
log10_ratio  = 1.0   1.3    1.5
; log10_M1 = log10_Mmin + log10_ratio is reconstructed downstream by
; MOR_HOD_t (mor_hod_t.hh) and sel_function.py (line 497) and bsel.py.
alpha        = 0.4   0.86   1.4
epsilon      = -1.0  0.0    1.0
sigma_lambda = 0.05  0.18   0.50

[photoz]
delta_z = 0.0
