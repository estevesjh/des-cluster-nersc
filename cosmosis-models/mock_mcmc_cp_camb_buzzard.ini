; Buzzard-mock pipeline overrides (issues #1/#2 here +
; estevesjh/y3_cluster_cpp#8/#12).
;
; %includes the base pipeline and overrides ONLY what the Buzzard runs
; need (later keys win in the cosmosis Inifile parser). The base ini is
; left untouched because the widePlanck self-closure data vectors were
; generated with its settings and must keep matching their own model.
;
; OBSERVED-z BIN EDGES ARE DELIBERATELY *NOT* OVERRIDDEN. The production
; DV harvester (validations/build_buzzard_datavector.py) bins z_obs with
; the SAME edges as the base pipeline -- ZMIN_LIST=[0.20,0.35,0.50] /
; ZMAX_LIST=[0.35,0.50,0.65] -- and drops the box seam as a TRUE-z cut
; (z_true in [0.33,0.37] excluded, line ~106). Matching that in the
; model needs a true-z exclusion range inside the selection integrand
; (estevesjh/y3_cluster_cpp#8), not different observed-z edges: an
; earlier revision of this file overrode the edges to [0.20,0.33) /
; [0.37,0.50) per issue #2's original premise, which the harvester
; source disproves.
;
; Default data vector: the h-unit-fixed Buzzard DV. Run scripts may
; override likelihoods.filename as usual.

%include ${DES_CLUSTER_NERSC_DIR}/cosmosis-models/mock_mcmc_cp_camb.ini

[likelihoods]
filename = ${DES_CLUSTER_NERSC_DIR}/data/mock/dv_buzzard_jkcov_hfix.npz

; Dense distances/P(k) z-grid (estevesjh/y3_cluster_cpp#12): nz=50's
; piecewise-linear chi has a -1.4% local-slope z-sawtooth that distorts
; the exclusion-ring geometry of the whole projection chain (shear_prj
; cl channel moves up to 1.7% end-to-end at nz=400). Safe to fix here:
; the Buzzard DV is measured from the sim, not model-closed.
[cp_camb]
nz = 400
