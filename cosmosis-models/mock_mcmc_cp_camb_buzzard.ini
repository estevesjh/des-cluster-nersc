; Buzzard-mock pipeline: mock_mcmc_cp_camb.ini with the observed-z bin
; edges corrected to match the Buzzard mock's binning (issue
; estevesjh/des-nersc-cluster-scripts#2).
;
; The mock (xtang126/mock_cluster_buzzard) bins clusters in observed z as
;   [0.20, 0.33), [0.37, 0.50), [0.50, 0.65)
; with the simulation box seam [0.33, 0.37) DROPPED, while the base ini
; uses [0.20, 0.35), [0.35, 0.50), [0.50, 0.65) -- the model integrated
; through the seam and used a wrong low-z edge, over-predicting counts
; worst in the low-z bin (data/theory 0.55 low-z -> 0.77 high-z).
;
; This file %includes the base pipeline and overrides ONLY the
; z-binned sections (later keys win in the cosmosis Inifile parser).
; The base ini is left untouched because the widePlanck self-closure
; data vectors (mock_dv_widePlanck*.npz) were generated with the old
; edges and must keep matching their own model.
;
; NOT covered here (needs code, estevesjh/y3_cluster_cpp#8): excising
; the seam from the TRUE-z integration -- halos with z_true in
; [0.33, 0.37) still scatter into the observed bins via P(zo|zt),
; and Omega(z) is still the hardcoded Y1-SPT footprint.
;
; Default data vector: the h-unit-fixed Buzzard DV. Run scripts may
; override likelihoods.filename as usual.

%include ${DES_CLUSTER_NERSC_DIR}/cosmosis-models/mock_mcmc_cp_camb.ini

[likelihoods]
filename = ${DES_CLUSTER_NERSC_DIR}/data/mock/dv_buzzard_jkcov_hfix.npz

; 12 (lambda, zob) bins: 4 richness x 3 zob, zob edges per Buzzard mock.
[sel_function]
zob_min = 0.20 0.20 0.20 0.20 0.37 0.37 0.37 0.37 0.50 0.50 0.50 0.50
zob_max = 0.33 0.33 0.33 0.33 0.50 0.50 0.50 0.50 0.65 0.65 0.65 0.65

[b_sel_marg]
zo_low     = 0.20 0.20 0.20 0.20 0.37 0.37 0.37 0.37 0.50 0.50 0.50 0.50
zo_high    = 0.33 0.33 0.33 0.33 0.50 0.50 0.50 0.50 0.65 0.65 0.65 0.65

; bsel evaluates b_sel(theta) at the observed-bin centres.
[bsel]
zob = 0.265 0.435 0.575

