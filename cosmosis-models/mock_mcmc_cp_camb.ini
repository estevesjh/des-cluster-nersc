zo_high      = 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.35 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.50 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65 0.65
radii      = 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000 0.20000 0.28599 0.40896 0.58480 0.83625 1.19581 1.70998 2.44521 3.49658 5.00000


; ========================================================================
; shear_prj_frozen_physics: frozen-physics fixed-grid DeltaSigma_prj/gamma_t^prj
; (Option C of the RichnessSelection plan "Port frozen-physics b_sel/
; DeltaSigma_prj recipe into the cosmosis pipeline"). Same physics as
; shear_prj (ShearPrjEvaluator) reduced via the exact rnd-channel z-hoist +
; r_s(M)-anchored a_b(z) cl-channel amplitude drift (docs/
; richness_selection_frozen.tex), assembled via an explicit fixed
; N_theta x N_M grid + dot product (no Cuhre/cubacpp) -- ~3.2x faster than
; shear_prj at n_lnm=16/n_per_seg=10 with <0.2% precision loss vs the full
; n_lnm=24/n_per_seg=10 resolution. Publishes dsigma_prj_frozen_physics/
; shear_prj_frozen_physics/{vals,rnd,cl} AND aliases to shear_prj/{vals,rnd,cl}
; for drop-in compatibility with likelihood_cp.py / generate_mock_dv.py.
;
; include_omega_z=0: Omega(z) is deliberately excluded here, matching
; ShearPrjEvaluator's own convention -- production's sigma_prj_t.hh has an
; explicit comment that Omega(z) must NOT appear for a surface-density
; observable (it cancels between numerator/normalisation, unlike number
; counts). Confirmed empirically: with include_omega_z=1 the fiducial
; likelihood closure breaks (-151.68 vs the required ~0); with it off,
; closure holds (-0.004). RichnessSelection now has a SurveyArea dataclass
; (unity/constant/polynomial, richness_selection.survey_area) for this same
; choice on the Python side -- revisit once a mock data vector is
; regenerated with a deliberate survey-area convention on both sides.
; ========================================================================
[shear_prj_frozen_physics]
file = ${Y3_CLUSTER_CPP_DIR}/release-build/src/modules/sigma_prj_cpu/ShearPrjFrozenPhysics.so
zt_low      = 0.10
zt_high     = 0.75
lnm_low     = 29.9336
lnm_high    = 35.6814
R_max_cMpch = 35.0
n_lnm       = 16
n_per_seg   = 10
n_zring     = 20
n_zouter    = 20
include_omega_z = 0
